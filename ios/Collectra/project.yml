name: Collectra
options:
  bundleIdPrefix: com.collectra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Collectra/Configuration/Debug.xcconfig
  Release: Collectra/Configuration/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Collectra:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Collectra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collectra.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: Collectra/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for this phase
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      path: Collectra/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Collectra
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Collectra uses your camera to identify cards and add them to your collection.
        API_BASE_URL: $(API_BASE_URL)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    dependencies:
      - package: Supabase
        product: Supabase

  CollectraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CollectraTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.collectra.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Collectra
    dependencies:
      - target: Collectra

  CollectraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CollectraUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.collectra.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Collectra
    dependencies:
      - target: Collectra
schemes:
  Collectra:
    build:
      targets:
        Collectra: all
        CollectraTests: [test]
        CollectraUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CollectraTests
        - CollectraUITests
    archive:
      config: Release
